<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCW Academy — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b3dff 0%, #dc2626 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }
    .logo span {
      font-size: 1.75rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #8b3dff, #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: #6b7280;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 320px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .retry {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b3dff, #dc2626);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo"><span>PCW</span></div>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>Please reconnect to continue training. Your progress will sync when you're back online.</p>
  <button class="retry" onclick="window.location.reload()">Try Again</button>
</body>
</html>
